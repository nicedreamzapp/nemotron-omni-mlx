site_name: nemotron-omni-mlx
site_description: >-
  Run NVIDIA Nemotron-3-Nano-Omni (text, vision and audio) entirely on an Apple Silicon Mac.
  A pure MLX runtime for the C-RADIO vision tower and Parakeet audio tower, checked against
  NVIDIA's PyTorch reference.
site_author: Matt Macosko
# TODO-VERIFY: placeholder until GitHub Pages is switched on for this repo.
site_url: https://nicedreamzapp.github.io/nemotron-omni-mlx/
repo_url: https://github.com/nicedreamzapp/nemotron-omni-mlx
repo_name: nicedreamzapp/nemotron-omni-mlx
edit_uri: edit/main/docs/
copyright: Runtime code MIT. Model weights are NVIDIA's, under the NVIDIA Open Model License.

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - social
  # sitemap.xml is generated by MkDocs itself whenever site_url is set.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Credits: credits.md

validation:
  links:
    anchors: warn
